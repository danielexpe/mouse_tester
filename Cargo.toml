[package]
name = "mouse_test"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Visual mouse tester for the Linux console"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
